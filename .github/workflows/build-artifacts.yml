name: Build host artifacts

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate generated host packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version is not behind latest tag
        run: |
          git fetch --tags --quiet
          LATEST_TAG=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -n "$LATEST_TAG" ]; then
            TAG_VER="${LATEST_TAG#v}"
            PKG_VER=$(python3 -c "import json; print(json.load(open('src/package.json'))['version'])")
            LOWEST=$(printf '%s\n%s' "$PKG_VER" "$TAG_VER" | sort -V | head -1)
            if [ "$LOWEST" = "$PKG_VER" ] && [ "$PKG_VER" != "$TAG_VER" ]; then
              echo "src/package.json $PKG_VER is behind latest tag $TAG_VER — bump the version"
              exit 1
            fi
            echo "version ok: $PKG_VER >= $TAG_VER"
          fi

      - name: Verify packages are in sync with source
        run: python3 scripts/package.py check --target all

      - name: Run package validation
        run: |
          python3 test/package_test.py
          python3 test/claude_plugin_test.py
          python3 test/personality_pack_contract_test.py
          python3 test/behavior_test.py
          python3 test/extractor_test.py
          python3 test/live_model_test.py --dry-run

      - name: Build tarballs for distribution
        run: |
          python3 scripts/package.py build --target all
          mkdir -p dist
          tar -czf dist/personify-codex.tar.gz codex
          tar -czf dist/personify-claude.tar.gz claude .claude-plugin
          tar -czf dist/personify-gemini.tar.gz gemini gemini-extension.json
          tar -czf dist/personify-all-hosts.tar.gz codex claude gemini .claude-plugin .codex-plugin gemini-extension.json

      - name: Upload generated packages
        uses: actions/upload-artifact@v4
        with:
          name: personify-host-packages
          path: dist/*.tar.gz
          if-no-files-found: error

  release-assets:
    name: Attach host packages to GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download generated packages
        uses: actions/download-artifact@v4
        with:
          name: personify-host-packages
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Generated Personify host packages."
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber
